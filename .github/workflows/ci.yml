name: ghostkit

# CI for main, and the npm release of ghostkit: pushing a v<version> tag (v0.1.0-dt.7) on main tests, packs and
# publishes it. See "Releasing" in README.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostkit-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          }

      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds dist/ and regenerates examples/GhostofavmSDK.ts. Both are committed, and dist/ is what is published, so
      # they must be what the source builds (tsc drops bin.js's executable bit, hence fileMode=false).
      - name: Build, and check the committed build matches
        run: |
          npm run build
          git -c core.fileMode=false diff --exit-code --stat -- dist examples || {
            echo "::error::dist/ or examples/ differ from what the source builds: run npm run build and commit"
            exit 1
          }

      # Offline, once with the dtalgorand fork of algokit-utils and once with stock algokit-utils. Its global setup
      # generates the SDKs in test/generated/ (not committed), which the type check below needs.
      - name: Test
        run: npm test

      - name: Check types
        run: npm run check:example

      - name: Check the version in package.json, package-lock.json, the README and the tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-check.mjs "$TAG"

      - name: Pack
        if: github.ref_type == 'tag'
        run: npm pack

      - name: Upload package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: ghostkit-*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The trusted publisher on npmjs.com names this environment. Add required reviewers to it on GitHub to approve
    # each release by hand.
    environment:
      name: npm
      url: https://www.npmjs.com/package/ghostkit/v/${{ steps.version.outputs.version }}
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - name: Check npm version
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)))) process.exit(0);
            console.error("::error::npm " + process.argv[1] + " is older than 11.5.1, which trusted publishing needs");
            process.exit(1);
          ' "$(npm -v)"

      - name: Read version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package
          path: package

      # Authenticates with npm trusted publishing (OIDC), which also adds provenance; there is no token. npm 11
      # publishes a prerelease (0.1.0-dt.7) only with an explicit --tag; latest makes it what `npm i ghostkit` gets.
      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "ghostkit@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::ghostkit@$VERSION is already on npm, not publishing it again"
          else
            # ./ makes npm read a file: without it, package/<file> is a GitHub shorthand
            npm publish "./package/ghostkit-$VERSION.tgz" --tag latest
          fi

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::The $GITHUB_REF_NAME release already exists"
            exit 0
          fi
          {
            echo "npm: [ghostkit@$VERSION](https://www.npmjs.com/package/ghostkit/v/$VERSION). Install it as described in the [README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#install-ghostkit)."
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo
              echo "## Changes since $prev"
              echo
              git log --first-parent --format='- %s (%h)' "$prev..$GITHUB_REF_NAME"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "package/ghostkit-$VERSION.tgz" \
            --verify-tag --latest --title "ghostkit $VERSION" --notes-file notes.md
